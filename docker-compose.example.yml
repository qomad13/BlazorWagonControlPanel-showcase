version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: vagonlab-mysql-demo
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vagon_demo
      MYSQL_USER: demo_user
      MYSQL_PASSWORD: CHANGE_ME
      MYSQL_ROOT_PASSWORD: CHANGE_ME_ROOT
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  db_data:
    driver: local

